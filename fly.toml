# fly.toml app configuration file generated for bugtracker-se2-gr3-api on 2026-05-15T01:53:22+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bugtracker-se2-gr3-api'
primary_region = 'fra'

[build]
  dockerfile = 'backend/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
