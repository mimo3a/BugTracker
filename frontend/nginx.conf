server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Statische Assets aggressiv cachen (Hashes im Dateinamen).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend-Proxy: /api/* an Spring-Boot weiterleiten.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # SPA-Fallback: alle anderen Routen liefern index.html, damit React Router
    # auch direkte URL-Aufrufe (z.B. /bugs/42, /admin/users) korrekt rendert.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
