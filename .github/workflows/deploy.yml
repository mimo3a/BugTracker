name: Deploy Backend (Fly.io)

# Pipeline: Push auf main -> Build+Tests -> nur bei gruen -> Fly-Deploy.
# Frontend deployt separat & automatisch ueber Vercel (Push auf GitHub-main).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Verhindert ueberlappende Deploys; ein laufender Deploy wird NICHT abgebrochen.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test (Java 21 · PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bugtracker
          POSTGRES_USER: bugtracker
          POSTGRES_PASSWORD: bugtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugtracker -d bugtracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bugtracker
          SPRING_DATASOURCE_USERNAME: bugtracker
          SPRING_DATASOURCE_PASSWORD: bugtracker
        run: mvn -B -ntp clean verify

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    needs: test               # laeuft NUR wenn der test-Job gruen ist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Baut das Image auf Flys Remote-Builder (kein Docker im Runner noetig),
      # liest fly.toml aus dem Repo-Root, rollt mit der dort definierten Strategie aus.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
